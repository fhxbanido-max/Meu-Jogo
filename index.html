<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxy Strike</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070816;--cy:#4df3ff;--mg:#ff3da6;--go:#ffd24d;--tx:#e8f0ff;--pn:#121534;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:500 14px 'Chakra Petch',system-ui,sans-serif}
#st{position:absolute;left:50%;top:50%;width:360px;height:640px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#000;box-shadow:0 0 0 1px #2a3070,0 0 40px #4df3ff22}
#c{display:block;width:360px;height:640px;touch-action:none}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:10px;padding:18px 16px;background:rgba(5,6,20,.88);text-align:center;overflow:auto;touch-action:pan-y}
.sc.on{display:flex}.sc>:first-child{margin-top:auto}.sc>:last-child{margin-bottom:auto}
h1{margin:0;font-size:46px;line-height:.95;letter-spacing:2px;color:var(--cy);text-shadow:0 0 18px var(--cy)}h1 b{color:var(--mg);text-shadow:0 0 18px var(--mg)}
h2{margin:0;font-size:26px;color:var(--cy)}
small{opacity:.8;font-size:11px}.cr{opacity:1;font-size:12px;line-height:1.45}.cr b{color:var(--go)}.lb{opacity:.7;font-size:12px;margin-top:4px}.co{color:var(--go);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.bt{width:100%;max-width:260px;padding:12px;border:2px solid var(--cy);background:#0b1b33;border-radius:10px;font-size:17px;font-weight:700;box-shadow:0 0 12px #4df3ff44}
.bt:active{background:#134}.bt.own{border-color:var(--go);font-size:14px}.bt.own.on{background:#3a2c00;box-shadow:0 0 16px #ffd24d88}
.row,.grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ch{padding:7px 10px;border:1px solid #3b4290;background:#10143a;border-radius:8px}.ch.on{border-color:var(--mg);background:#3a0f2e}
.cd{width:76px;padding:6px 2px;border:1px solid #3b4290;background:var(--pn);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.cd.on{border-color:var(--cy);box-shadow:0 0 10px #4df3ff66}
.up{display:flex;width:100%;justify-content:space-between;align-items:center;padding:7px 10px;border:1px solid #3b4290;background:var(--pn);border-radius:8px;text-align:left}
#hb{position:absolute;right:10px;bottom:14px;display:none}
#hb button{width:60px;height:60px;border-radius:50%;border:2px solid var(--mg);background:#1a0a22cc;font-size:24px;touch-action:none}
#tb{position:absolute;right:8px;top:52px;display:none;gap:6px}
#tb button{width:34px;height:34px;border-radius:50%;border:2px solid var(--cy);background:#0a1a2acc;font-size:14px}
#mb,#fs{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:2px solid var(--cy);background:#0a1a2acc;font-size:14px}
.pl #hb{display:flex;gap:10px}.pl #tb{display:flex}#fs{right:48px}.pl #mb,.pl #fs{display:none}
</style>
</head>
<body>
<div id="st">
<canvas id="c" width="360" height="640"></canvas>
<div id="tb"><button data-a="pause">⏸</button><button data-a="mute">🔊</button></div>
<div id="hb"><button data-b="1">⚡</button><button>💥</button></div>
<div class="sc" id="sc"></div>
<button id="mb" data-a="mute">🔊</button><button id="fs" data-a="fs">⛶</button>
</div>
<script>
const $=s=>document.querySelector(s),W=360,H=640,cv=$('#c'),x=cv.getContext('2d'),st=$('#st'),sc=$('#sc');
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let S={coins:0,best:0,ships:[1,0,0,0],ship:0,up:[0,0,0,0],diff:1,owner:false,mute:false,sk:0,sks:[1,0,0,0,0]};
try{Object.assign(S,JSON.parse(localStorage.getItem('gs5')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gs5',JSON.stringify(S))}catch(e){}};
const SH=[
{n:'Falcon',c:'#4df3ff',hp:3,sp:1,fr:.22,dm:1,p:0,d:'Equilibrada'},
{n:'Viper',c:'#7dff6a',hp:2,sp:1.3,fr:.14,dm:.8,p:700,d:'Veloz'},
{n:'Titan',c:'#ffb347',hp:5,sp:.8,fr:.3,dm:1.9,p:1600,d:'Blindada'},
{n:'Phantom',c:'#d28bff',hp:3,sp:1.1,fr:.18,dm:1.2,p:3200,d:'Tiro duplo'}];
const DF=[{n:'Fácil',hp:.7,sp:.8,sr:.75,cm:.7,l:2},{n:'Normal',hp:1,sp:1,sr:1,cm:1,l:0},{n:'Difícil',hp:1.5,sp:1.2,sr:1.3,cm:1.6,l:-1},{n:'Insano',hp:2.2,sp:1.45,sr:1.7,cm:2.6,l:-1}];
const UP=['Dano +15%','Cadência +8%','Ímã de moedas','Ganho de moedas +12%'];
const ET=[{c:'#ff3da6',r:14,hp:1,v:75,pts:10,cv:1},{c:'#7dff6a',r:16,hp:2,v:55,pts:25,cv:2},{c:'#ffb347',r:20,hp:6,v:38,pts:60,cv:4},{c:'#ff5252',r:42,hp:70,v:30,pts:1000,cv:60},{c:'#ff8a3d',r:13,hp:2,v:150,pts:35,cv:2}];
const PK={w:['#4df3ff','⚡'],h:['#ff3d6e','+'],b:['#ff9d5c','B'],s:['#7dff6a','🛡'],l:['#ff4df0','L'],d:['#ffd24d','D'],z:['#9b8cff','Z']};

/* ---------- imagens (desenhadas por código) ---------- */
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c};
const poly=(g,P,fill,line)=>{g.beginPath();P.forEach((p,i)=>g[i?'lineTo':'moveTo'](p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=line;g.lineWidth=1.5;g.stroke()};
const lg=(g,y0,y1,a,b)=>{const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q};
const SP=[
[[0,-22],[6,-6],[22,10],[22,17],[8,11],[5,20],[-5,20],[-8,11],[-22,17],[-22,10],[-6,-6]],
[[0,-23],[5,-8],[11,-4],[21,21],[6,11],[0,17],[-6,11],[-21,21],[-11,-4],[-5,-8]],
[[0,-20],[10,-15],[15,-3],[23,3],[23,18],[11,21],[6,12],[-6,12],[-11,21],[-23,18],[-23,3],[-15,-3],[-10,-15]],
[[0,-23],[4,-11],[17,-16],[13,2],[23,19],[6,11],[0,21],[-6,11],[-23,19],[-13,2],[-17,-16],[-4,-11]]];
const shipS=SH.map((s,i)=>mk(48,48,g=>{g.translate(24,24);g.shadowColor=s.c;g.shadowBlur=9;poly(g,SP[i],lg(g,-22,22,'#fff',s.c),'#fff');g.shadowBlur=0;g.fillStyle='#0ff9';g.beginPath();g.ellipse(0,-4,3,6,0,0,7);g.fill();g.fillStyle='#fff6';g.fillRect(-1,-14,2,24)}));
const enS=ET.map((d,t)=>{const R=d.r+6;return mk(R*2,R*2,g=>{g.translate(R,R);g.shadowColor=d.c;g.shadowBlur=8;const r=d.r,f=lg(g,-r,r,'#fff',d.c);
if(t==0||t==4)poly(g,[[0,r],[r,-r*.8],[0,-r*.3],[-r,-r*.8]],f,'#fff');
else if(t==1){g.fillStyle=f;g.beginPath();g.ellipse(0,0,r,r*.55,0,0,7);g.fill();g.fillStyle='#124';g.beginPath();g.arc(0,-r*.15,r*.4,Math.PI,0);g.fill();g.fillStyle=d.c;[-1,0,1].forEach(k=>g.fillRect(k*r*.5-2,r*.15,4,4))}
else if(t==2){poly(g,[0,1,2,3,4,5].map(k=>[Math.cos(k*1.047+.52)*r,Math.sin(k*1.047+.52)*r]),f,'#fff');g.fillStyle='#300';g.beginPath();g.arc(0,0,r*.45,0,7);g.fill();g.fillStyle=d.c;g.beginPath();g.arc(0,0,r*.22,0,7);g.fill()}
else{poly(g,[[0,r],[r*.5,r*.4],[r,-r*.2],[r*.7,-r*.8],[r*.25,-r*.5],[0,-r*.8],[-r*.25,-r*.5],[-r*.7,-r*.8],[-r,-r*.2],[-r*.5,r*.4]],f,'#fff');g.fillStyle='#200';g.beginPath();g.arc(0,0,r*.3,0,7);g.fill();g.fillStyle='#ff0';g.beginPath();g.arc(0,0,r*.12,0,7);g.fill()}})});
const BG=mk(360,1280,g=>{g.fillStyle=lg(g,0,1280,'#05061a','#0d0a2e');g.fillRect(0,0,360,1280);
[[90,260,170,'#4d1fa8'],[290,640,200,'#0b6a8a'],[120,1020,190,'#8a1f66']].forEach(([a,b,r,c])=>{const q=g.createRadialGradient(a,b,0,a,b,r);q.addColorStop(0,c+'99');q.addColorStop(1,c+'00');g.fillStyle=q;g.fillRect(0,b-r,360,r*2)});
const q=g.createRadialGradient(270,430,6,285,445,60);q.addColorStop(0,'#ffcf8a');q.addColorStop(.6,'#c4572e');q.addColorStop(1,'#3a1220');g.fillStyle=q;g.beginPath();g.arc(285,445,56,0,7);g.fill();
g.strokeStyle='#ffe2b088';g.lineWidth=4;g.beginPath();g.ellipse(285,445,92,16,-.35,0,7);g.stroke();
g.fillStyle='#fff';for(let i=0;i<120;i++){g.globalAlpha=rnd(.2,.8);g.fillRect(rnd(0,360),rnd(0,1280),1,1)}});
const SK=[{n:'Padrão',c:0,p:0},{n:'Rubi',c:'#ff2d55',p:400},{n:'Ouro',c:'#ffd24d',p:800},{n:'Neon',c:'#39ff14',p:800},{n:'Gelo',c:'#9be7ff',p:1200}],SPN=[['Escudo',12],['Rajada',10],['Onda',14],['Mísseis',12]];
const skS=SH.map((_,i)=>SK.map(k=>k.c?mk(48,48,g=>{g.drawImage(shipS[i],0,0);g.globalCompositeOperation='source-atop';g.globalAlpha=.5;g.fillStyle=k.c;g.fillRect(0,0,48,48)}):shipS[i]));
const stars=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.5,2.5)}));

/* ---------- sons (Web Audio) ---------- */
let AC,lc=0,MB,DL,NB;
const aud=()=>{try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MB=AC.createGain();MB.gain.value=.8;MB.connect(AC.destination);DL=AC.createDelay();DL.delayTime.value=.27;const fb=AC.createGain();fb.gain.value=.32;DL.connect(fb);fb.connect(DL);DL.connect(MB);NB=AC.createBuffer(1,AC.sampleRate>>1,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}AC.resume()}catch(e){}};
const snd=(f,d,t,v,sl)=>{if(S.mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)};
const SFX={shot:()=>snd(900,.07,'square',.025,-600),boom:()=>snd(180,.35,'sawtooth',.09,-140),hit:()=>snd(130,.3,'sawtooth',.12,-80),pow:()=>snd(500,.3,'sine',.09,700),bomb:()=>snd(100,.9,'sawtooth',.14,-70),coin:()=>{const n=performance.now();if(n-lc>60){lc=n;snd(1300,.08,'triangle',.05,600)}}};
/* trilhas originais (melodias próprias). Inspiradas no clima electro de Flower In A Hurricane, do Justice */
const TR=[
{n:'Neon Cruise',bpm:112,T:110,P:[[0,1],[-4,0],[3,0],[-2,0]],K:[0,6,8,10],S:[4,12],B:[0,2,4,6,8,10,12,14],O:[6,14],bw:'sawtooth',lw:'square',
M:[[0,7,2],[3,12,1],[4,10,2],[8,7,3],[12,3,2],[16,8,2],[19,12,1],[20,8,2],[24,3,3],[28,5,2],[32,10,2],[35,15,1],[36,12,2],[40,10,3],[44,7,2],[48,5,2],[51,10,1],[52,14,2],[56,12,3],[60,10,2]]},
{n:'Hurricane Bloom',bpm:124,T:98,P:[[0,1],[-2,0],[-4,0],[-5,0]],K:[0,4,8,12],S:[4,12],B:[2,3,6,7,10,11,14,15],O:[3,11],ST:[2,6,10,14],bw:'sawtooth',lw:'sawtooth',
M:[[0,7,1],[2,12,1],[3,15,2],[6,14,2],[8,12,2],[11,7,1],[12,10,2],[16,5,1],[18,10,1],[19,14,2],[22,12,2],[24,10,2],[27,5,1],[28,7,2],[32,3,1],[34,8,1],[35,12,2],[38,10,2],[40,8,2],[43,3,1],[44,5,2],[48,2,1],[50,7,1],[51,11,2],[52,14,2],[56,12,2],[58,11,2],[60,7,3]]},
{n:'Bloom Chill',bpm:84,T:98,P:[[0,1],[-2,0],[-4,0],[-5,0]],K:[0,10],S:[8],B:[0,6,10],O:[],bw:'triangle',lw:'sine',
M:[[0,12,6],[8,7,6],[16,10,6],[24,14,4],[32,8,6],[40,12,6],[48,11,4],[52,14,6]]},
{n:'Bloom Arcade',bpm:150,T:110,P:[[0,1],[-2,0],[-4,0],[-5,0]],K:[0,8],S:[4,12],B:[0,2,4,6,8,10,12,14],O:[4,12],A:1,bw:'square',lw:'square',M:[]}];
const tr=()=>TR[S.trk]||TR[0];
const tk=()=>`<div class=lb>Trilha sonora</div><div class=row>${TR.map((t,i)=>`<button class="ch ${i==(S.trk|0)?'on':''}" data-a=trk data-i=${i}>${t.n}</button>`).join('')}</div>`;
let nt=0,ns=0;
const tn=(f,t,d,ty,v,fx)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MB);if(fx)g.connect(DL);o.start(t);o.stop(t+d+.02)};
const nz=(t,d,v,hp)=>{const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MB);s.start(t);s.stop(t+d)};
const kick=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.14);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(MB);o.start(t);o.stop(t+.26)};
function step(i,t){const r=tr(),b=i>>4,s=i&15,[o,mn]=r.P[b],sd=60/r.bpm/4,q=mn?[0,3,7]:[0,4,7],F=(k,x)=>r.T*k*2**((o+x)/12);
if(r.K.includes(s))kick(t);
if(r.S.includes(s)){nz(t,.18,.14,1500);tn(190,t,.1,'triangle',.08)}
if(s%2==0||r.A)nz(t,.04,.05,7000);
if(r.B.includes(s))tn(F(.5,0)*(r.O.includes(s)?2:1),t,sd*1.8,r.bw,.05);
if(r.ST){if(r.ST.includes(s))q.forEach(x=>tn(F(2,x),t,sd*1.5,'sawtooth',.025))}else if(s==0)q.forEach(x=>tn(F(2,x),t,sd*15,'triangle',.035));
if(r.A)tn(F(4,[0,q[1],q[2],12][s&3]),t,sd*.9,'square',.02);
const m=r.M.find(n=>n[0]==i);if(m)tn(r.T*4*2**(m[1]/12),t,sd*m[2]+.1,r.lw,.03,1)}
setInterval(()=>{if(!AC||S.mute||state=='pause'){nt=0;return}const n=AC.currentTime,sd=60/tr().bpm/4;if(nt<n)nt=n+.05;while(nt<n+.15){step(ns%64,nt);nt+=sd;ns++}},40);

/* ---------- jogo ---------- */
let G,state='menu',dr=null,last=0,bgY=0,shake=0;const keys={};
const K=(...a)=>a.some(q=>keys[q])?1:0;
const cm=()=>G.combo*DF[S.diff].cm*(1+.12*S.up[3])*(S.owner?3:1);
const upc=i=>Math.round((S.up[i]+1)*100*(S.owner?.5:1));
const ui=h=>{sc.innerHTML=h;sc.classList.toggle('on',!!h);sc.scrollTop=0};
const pz=()=>ui(`<h2>Pausado</h2><button class=bt data-a=resume>Continuar</button>${S.owner?`<div class=lb>Painel do Dono</div><div class=row><button class=ch data-a=o1>Pular onda</button><button class=ch data-a=o2>+1000 🪙</button><button class=ch data-a=o3>Chamar chefe</button><button class="ch ${G.god?'on':''}" data-a=o4>Imortal</button></div>`:''}<button class=bt data-a=menu>Sair para o menu</button>`);
const sb=$('#hb [data-b]');
function special(){if(state!='play')return;const g=G,p=g.p;if(p.cd>0)return;p.cd=S.owner?3:SPN[S.ship][1];SFX.pow();
if(S.ship==0)p.inv=Math.max(p.inv,4);else if(S.ship==1)p.rf=3;
else if(S.ship==2){shake=10;g.eb=[];g.e.forEach(e=>{e.hp-=6;if(e.hp<=0)kill(e)});for(let i=0;i<30;i++){const a=i/30*6.28;g.fx.push({x:p.x,y:p.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,l:.5,c:'#ffb347',r:3})}}
else for(let i=0;i<8;i++)g.b.push({x:p.x+(i-3.5)*6,y:p.y-10,vx:(i-3.5)*40,vy:-300,dm:3,h:1})}
function mkE(t,px,py){const d=ET[t],hp=d.hp*DF[S.diff].hp*(1+G.wave*(t==3?.15:.06));return{t,x:px,y:py,r:d.r,hp,m:hp,ph:rnd(0,6),f:rnd(1,3),bv:t==3?(G.wave/5-1)%3|0:0}}
function start(){const sh=SH[S.ship],ow=S.owner,hp=Math.max(1,sh.hp+DF[S.diff].l+(ow?2:0));
G={p:{x:180,y:540,hp,max:hp,w:S.ship==3?2:1,inv:1.5,t:0,rg:0,cd:0,rf:0,lz:0,dr:0},b:[],e:[],eb:[],c:[],pw:[],fx:[],sc:0,co:0,wave:0,combo:1,ct:0,bombs:ow?99:2,q:0,sp:0,msg:'',mt:0,fl:0,sl:0};
nextWave();state='play';dr=null;ui('');st.classList.add('pl')}
function nextWave(){const g=G;g.wave++;g.mt=2.2;if(g.wave%5==0){g.msg='⚠ Chefe da onda '+g.wave;g.q=0;g.e.push(mkE(3,180,-50))}else{g.msg='Onda '+g.wave;g.q=5+g.wave*2}g.sp=1}
function boom(px,py,c,n){for(let i=0;i<n;i++){const a=rnd(0,6.3),s=rnd(40,200);G.fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.8),c,r:rnd(1.5,3.5)})}}
function kill(e){const g=G,d=ET[e.t];e.dead=1;boom(e.x,e.y,d.c,e.t==3?70:16);SFX.boom();g.sc+=Math.round(d.pts*g.combo);const v=cm();
for(let i=0;i<d.cv;i++)g.c.push({x:e.x+rnd(-14,14),y:e.y+rnd(-10,10),vx:rnd(-50,50),vy:rnd(-90,10),v});
if(g.combo<5)g.combo++;g.ct=2.5;
if(e.t==3||Math.random()<.07)g.pw.push({x:e.x,y:e.y,k:['w','h','b','s','l','d','z'][Math.random()*7|0]});
if(e.t==3)shake=14}
function hurt(){const p=G.p;if(p.inv>0||G.god)return;p.hp--;p.inv=1.5;shake=12;navigator.vibrate&&navigator.vibrate(70);SFX.hit();boom(p.x,p.y,SH[S.ship].c,14);G.combo=1;if(p.hp<=0){boom(p.x,p.y,'#fff',40);over()}}
function bomb(){if(state!='play'||G.bombs<1)return;const g=G;if(!S.owner)g.bombs--;SFX.bomb();shake=16;g.eb=[];g.fl=.5;g.e.forEach(e=>{e.hp-=14;if(e.hp<=0)kill(e)})}
function upd(dt){const g=G,p=g.p,sh=SH[S.ship],D=DF[S.diff],ow=S.owner,u=S.up;
if(dr){const f=Math.min(1,dt*16);p.x+=(dr.tx-p.x)*f;p.y+=(dr.ty-p.y)*f}
else{const v=240*sh.sp*dt;p.x+=(K('ArrowRight','d')-K('ArrowLeft','a'))*v;p.y+=(K('ArrowDown','s')-K('ArrowUp','w'))*v}
p.x=cl(p.x,20,340);p.y=cl(p.y,60,590);p.inv-=dt;g.fl-=dt;p.cd-=dt;p.rf-=dt;p.lz-=dt;p.dr-=dt;if(g.sl>0)g.sl-=dt/.55;{const tx=p.cd>0?Math.ceil(p.cd):'⚡';if(sb.textContent!=tx)sb.textContent=tx;sb.style.opacity=p.cd>0?.4:1}
if(ow&&p.hp<p.max&&(p.rg+=dt)>12){p.hp++;p.rg=0}
if((p.t-=dt)<=0){p.t=sh.fr*(1-.08*u[1])/(p.rf>0?2.5:1);const dm=sh.dm*(1+.15*u[0])*(ow?1.5:1),O=p.w<2?[0]:p.w==2?[-7,7]:[-11,0,11];O.forEach((d,i)=>g.b.push({x:p.x+d,y:p.y-18,vx:p.w==3?(i-1)*55:0,dm,pi:p.lz>0}));if(p.dr>0){const da=performance.now()/300;g.b.push({x:p.x+Math.cos(da)*34,y:p.y+Math.sin(da)*20-10,vx:0,dm:dm*.6})}SFX.shot()}
g.b.forEach(b=>{if(b.h){let t=0,m=1e9;g.e.forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<m){m=d;t=e}});if(t){const a=Math.atan2(t.y-b.y,t.x-b.x);b.vx+=(Math.cos(a)*420-b.vx)*dt*5;b.vy+=(Math.sin(a)*420-b.vy)*dt*5}b.y+=b.vy*dt}else b.y-=640*dt;b.x+=b.vx*dt;if(b.y<-30||b.y>H+30)b.dead=1});
if(g.q>0&&(g.sp-=dt)<=0){g.sp=Math.max(.35,1.1-g.wave*.04)/D.sr;g.q--;if(g.wave>1&&Math.random()<.12){for(let i=-2;i<3;i++)g.e.push(mkE(0,180+i*40,-24-Math.abs(i)*26));g.q=Math.max(0,g.q-4)}else{let t=g.wave<2?0:g.wave<3?(Math.random()<.35?1:0):Math.random()<.2?2:Math.random()<.45?1:0;if(g.wave>2&&Math.random()<.18)t=4;g.e.push(mkE(t,rnd(30,330),-24))}}
else if(!g.q&&!g.e.length){const b=Math.round(12*g.wave*cm());g.co+=b;g.fx.push({tx:'+'+b+' bônus de onda',x:180,y:300,vy:-30,l:1.8,c:'#ffd24d'});nextWave()}
g.e.forEach(e=>{const d=ET[e.t],v=d.v*D.sp*(1+g.wave*.02);e.ph+=dt;
if(e.t==3){e.y=Math.min(e.y+v*dt*2,110);e.x=180+Math.sin(e.ph*.7)*120}else if(e.t==4){const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*v*.7*dt;e.y+=v*dt}else{e.y+=v*dt;if(e.t==1)e.x=cl(e.x+Math.sin(e.ph*3)*90*dt,20,340)}
if(e.y>0&&e.y<480&&e.t&&e.t<4&&(e.f-=dt)<=0){const B=e.t==3,V=e.bv;e.f=B?[1.2,.15,1.4][V]:rnd(2,3.5)/D.sr;const n=B?[5,1,3][V]:1;for(let i=0;i<n;i++){const a=B&&V==1?e.ph*6:Math.atan2(p.y-e.y,p.x-e.x)+(i-(n-1)/2)*.3,s=(B?150:130)*D.sp;g.eb.push({x:e.x,y:e.y+e.r*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s})}if(B&&V==2)for(let i=-1;i<2;i+=2)g.e.push(mkE(0,e.x+i*50,e.y+20))}
if(e.y>H+40)e.dead=1;
if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+11){hurt();if(e.t!=3)kill(e)}});
g.b.forEach(b=>g.e.forEach(e=>{if(!b.dead&&!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){if(b.pi){if((b.hs=b.hs||[]).includes(e))return;b.hs.push(e)}else b.dead=1;e.hp-=b.dm;g.fx.push({x:b.x,y:b.y,vx:rnd(-40,40),vy:rnd(-40,40),l:.25,c:'#fff',r:1.5});if(e.hp<=0)kill(e)}}));
g.eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-10||b.x>370||b.y<-10||b.y>H+10)b.dead=1;else if(Math.hypot(b.x-p.x,b.y-p.y)<10){b.dead=1;hurt()}});
const mg=ow?420:36+36*u[2];
g.c.forEach(c=>{const dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);if(d<mg){c.x+=dx/d*340*dt;c.y+=dy/d*340*dt}else{c.vy=Math.min(110,c.vy+120*dt);c.y+=c.vy*dt;c.x+=c.vx*dt;c.vx*=.98}
if(d<20){c.dead=1;g.co+=c.v;SFX.coin()}if(c.y>H+10)c.dead=1});
g.pw.forEach(q=>{q.y+=70*dt;if(Math.hypot(q.x-p.x,q.y-p.y)<22){q.dead=1;SFX.pow();if(q.k=='w'){if(p.w<3)p.w++;else g.sc+=200}else if(q.k=='b')g.bombs++;else if(q.k=='s')p.inv=Math.max(p.inv,6);else if(q.k=='l')p.lz=8;else if(q.k=='d')p.dr=12;else if(q.k=='z')g.sl=5;else p.hp=Math.min(p.max,p.hp+1)}if(q.y>H+10)q.dead=1});
if((g.ct-=dt)<=0)g.combo=1;g.mt-=dt;
g.fx.forEach(f=>{f.l-=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt});
['b','e','eb','c','pw'].forEach(k=>g[k]=g[k].filter(o=>!o.dead));g.fx=g.fx.filter(f=>f.l>0)}
function over(){const g=G,earn=Math.floor(g.co)+Math.floor(g.sc/200),nb=g.sc>S.best,cc=S.owner?0:100+20*g.wave;S.coins+=earn;g.bank=earn;if(nb)S.best=g.sc;save();state='end';dr=null;st.classList.remove('pl');
setTimeout(()=>{if(state=='end')ui(`<h2>Fim de jogo</h2><div style="font-size:34px;color:#fff">${g.sc}</div><div>${nb?'🏆 Novo recorde!':'Recorde '+S.best}</div><div class=co>+${earn} moedas${S.owner?' (👑 ×3)':''}</div><small>Onda ${g.wave}, ${DF[S.diff].n}</small>${g.cont||S.coins-earn<cc?'':`<button class=bt data-a=cont>Continuar (🪙 ${cc})</button>`}<button class=bt data-a=play>Jogar de novo</button><button class=bt data-a=shop>Hangar</button><button class=bt data-a=menu>Menu</button>`)},900)}

/* ---------- desenho ---------- */
function hud(){const g=G,p=g.p;x.font="700 15px 'Chakra Petch',system-ui";x.textBaseline='middle';x.textAlign='left';x.fillStyle='#fff';x.fillText('★ '+g.sc,10,16);
x.textAlign='center';x.fillStyle='#4df3ff';x.fillText('Onda '+g.wave,180,16);x.textAlign='right';x.fillStyle='#ffd24d';x.fillText('🪙 '+Math.floor(g.co),350,16);
for(let i=0;i<p.max;i++){x.globalAlpha=i<p.hp?1:.25;x.drawImage(skS[S.ship][S.sk|0],10+i*16,28,16,16)}x.globalAlpha=1;
x.textAlign='center';if(g.combo>1){x.fillStyle='#ff3da6';x.fillText('Combo ×'+g.combo,180,38)}
x.textAlign='right';x.fillStyle='#ff9d5c';x.fillText('💥 '+(S.owner?'∞':g.bombs),350,38);
if(S.owner){x.textAlign='left';x.fillStyle='#ffd24d';x.fillText('👑 Modo Dono',10,58)}
if(g.mt>0){x.globalAlpha=Math.min(1,g.mt);x.textAlign='center';x.font="700 26px 'Chakra Petch',system-ui";x.fillStyle='#fff';x.shadowColor='#4df3ff';x.shadowBlur=12;x.fillText(g.msg,180,200);x.shadowBlur=0;x.globalAlpha=1}}
function draw(dt){x.save();if(shake>0){x.translate(rnd(-shake,shake)/2,rnd(-shake,shake)/2);shake=Math.max(0,shake-dt*40)}
bgY=(bgY+30*dt)%1280;x.drawImage(BG,0,bgY-1280);x.drawImage(BG,0,bgY);
stars.forEach(s=>{s.y+=s.z*70*dt;if(s.y>H){s.y=-4;s.x=rnd(0,W)}x.globalAlpha=.3+s.z/4;x.fillStyle='#fff';x.fillRect(s.x,s.y,s.z,s.z*3)});x.globalAlpha=1;
const g=G;
if(g&&state!='menu'){const p=g.p,sc0=SK[S.sk|0].c||SH[S.ship].c,sg=(g.wave-1)/5%4|0;if(sg){x.fillStyle='hsla('+[0,190,130,320][sg]+',80%,40%,.14)';x.fillRect(0,0,W,H)}
g.c.forEach(c=>{x.fillStyle='#ffd24d';x.shadowColor='#ffd24d';x.shadowBlur=8;x.beginPath();x.arc(c.x,c.y,5,0,7);x.fill();x.fillStyle='#a87400';x.fillRect(c.x-1,c.y-3,2,6)});x.shadowBlur=0;
g.pw.forEach(q=>{const k=PK[q.k];x.fillStyle=k[0];x.beginPath();x.arc(q.x,q.y,11,0,7);x.fill();x.fillStyle='#000';x.font='700 13px system-ui';x.textAlign='center';x.fillText(k[1],q.x,q.y+1)});
g.e.forEach(e=>{const s=enS[e.t];x.drawImage(s,e.x-s.width/2,e.y-s.height/2);if(e.t==3){x.fillStyle='#400';x.fillRect(60,66,240,6);x.fillStyle='#ff5252';x.fillRect(60,66,240*Math.max(0,e.hp/e.m),6)}});
x.fillStyle=sc0;x.shadowColor=sc0;x.shadowBlur=8;g.b.forEach(b=>x.fillRect(b.x-1.5,b.y-8,3,13));
x.fillStyle='#ff3da6';x.shadowColor='#ff3da6';g.eb.forEach(b=>{x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});x.shadowBlur=0;
if(p.hp>0&&(p.inv<=0||p.inv>1.6||(performance.now()/60|0)%2)){x.fillStyle='#ffb347';x.beginPath();x.moveTo(p.x-5,p.y+18);x.lineTo(p.x+5,p.y+18);x.lineTo(p.x,p.y+26+rnd(0,8));x.fill();x.drawImage(skS[S.ship][S.sk|0],p.x-24,p.y-24);
if(S.owner){x.strokeStyle='#ffd24d88';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,28,0,7);x.stroke()}if(p.inv>1.6){x.strokeStyle='#7dff6a';x.lineWidth=3;x.beginPath();x.arc(p.x,p.y,31,0,7);x.stroke()}if(p.dr>0){const da=performance.now()/300;x.fillStyle='#ffd24d';x.beginPath();x.arc(p.x+Math.cos(da)*34,p.y+Math.sin(da)*20-10,5,0,7);x.fill()}}
g.fx.forEach(f=>{x.globalAlpha=Math.min(1,f.l*2);x.fillStyle=f.c;if(f.tx){x.font="700 16px 'Chakra Petch',system-ui";x.textAlign='center';x.fillText(f.tx,f.x,f.y)}else{x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()}});x.globalAlpha=1;
if(g.fl>0){x.fillStyle='rgba(255,255,255,'+g.fl+')';x.fillRect(0,0,W,H)}
hud()}
x.restore()}
function loop(t){const dt=Math.min(.05,(t-last)/1e3||0);last=t;
if(state=='play')upd(dt*(G.sl>0?.55:1));else if(state=='end'&&G){G.fx.forEach(f=>{f.l-=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt});G.fx=G.fx.filter(f=>f.l>0)}
draw(dt);requestAnimationFrame(loop)}

/* ---------- telas ---------- */
function menu(){if(!S.owner&&!S.ships[S.ship])S.ship=0;if(!S.owner&&!S.sks[S.sk|0])S.sk=0;
ui(`<h1>GALAXY<br><b>STRIKE</b></h1><small class=cr>Jogo criado por <b>Luiz Henrique de Teotonio Vilela</b>,<br>que está aprendendo e evoluindo a cada versão.</small><div class=co>🪙 ${S.coins} &nbsp; Recorde ${S.best}</div>
<button class=bt data-a=play>Jogar</button><button class=bt data-a=shop>Hangar</button>
<div class=lb>Dificuldade (mais difícil, mais moedas)</div>
<div class=row>${DF.map((d,i)=>`<button class="ch ${i==S.diff?'on':''}" data-a=diff data-i=${i}>${d.n}</button>`).join('')}</div>
${tk()}<button class="bt own ${S.owner?'on':''}" data-a=own>👑 Modo Dono: ${S.owner?'ativado':'desativado'}</button>
<small>${S.owner?'Moedas ×3, +2 vidas, bombas infinitas, +50% de dano, ímã máximo, regeneração, loja −50%, todas as naves liberadas':'Arraste para mover, o tiro é automático. Toque em 💥 (bomba) e ⚡ (especial).'}</small>`)}
function shop(){const ow=S.owner;
ui(`<h2>Hangar</h2><div class=co>🪙 ${S.coins}</div><div class=lb>Naves</div>
<div class=grid>${SH.map((s,i)=>{const own=S.ships[i]||ow;return `<div class="cd ${S.ship==i?'on':''}" data-a=ship data-i=${i}><canvas width=48 height=48 data-s=${i}></canvas><b>${s.n}</b><small>${s.d}<br>❤${s.hp} ${SPN[i][0]}</small><small class=co>${own?(S.ship==i?'Equipada':'Equipar'):'🪙 '+s.p}</small></div>`}).join('')}</div>
<div class=lb>Melhorias</div>
${UP.map((n,i)=>`<div class=up><span>${n}<br><small>Nível ${S.up[i]}/8</small></span><button class=ch data-a=up data-i=${i}>${S.up[i]>=8?'Máx':'🪙 '+upc(i)}</button></div>`).join('')}
<div class=lb>Skins (cor da nave e dos tiros)</div><div class=row>${SK.map((k,i)=>`<button class="ch ${i==(S.sk|0)?'on':''}" data-a=sk data-i=${i}>${k.n}${S.sks[i]||S.owner?'':' 🪙'+k.p}</button>`).join('')}</div><button class=bt data-a=menu>Voltar</button>`);
document.querySelectorAll('[data-s]').forEach(c=>c.getContext('2d').drawImage(skS[c.dataset.s][S.sk|0],0,0))}
function act(a,i){aud();
if(a=='play')start();
else if(a=='menu'){state='menu';st.classList.remove('pl');menu()}
else if(a=='shop'){state='menu';shop()}
else if(a=='diff'){S.diff=i;save();menu()}
else if(a=='own'){S.owner=!S.owner;if(!S.owner&&!S.ships[S.ship])S.ship=0;save();menu()}
else if(a=='ship'){if(S.ships[i]||S.owner)S.ship=i;else if(S.coins>=SH[i].p){S.coins-=SH[i].p;S.ships[i]=1;S.ship=i;SFX.pow()}else return;save();shop()}
else if(a=='up'){const c=upc(i);if(S.up[i]<8&&S.coins>=c){S.coins-=c;S.up[i]++;save();SFX.pow()}shop()}
else if(a=='pause'&&state=='play'){state='pause';st.classList.remove('pl');pz()}
else if(a=='resume'&&state=='pause'){state='play';st.classList.add('pl');ui('')}
else if(a=='sk'){if(S.sks[i]||S.owner)S.sk=i;else if(S.coins>=SK[i].p){S.coins-=SK[i].p;S.sks[i]=1;S.sk=i;SFX.pow()}else return;save();shop()}
else if(a=='cont'&&state=='end'){const g=G,p=g.p;S.coins-=g.bank+(S.owner?0:100+20*g.wave);save();g.cont=1;p.hp=Math.ceil(p.max/2);p.inv=3;g.eb=[];state='play';st.classList.add('pl');ui('')}
else if(S.owner&&state=='pause'&&a[0]=='o'&&a.length==2){if(a=='o1'){G.e=[];G.q=0}if(a=='o2')G.co+=1000;if(a=='o3')G.e.push(mkE(3,180,-50));if(a=='o4')G.god=!G.god;pz()}
else if(a=='fs'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>0)}
else if(a=='trk'){S.trk=i;save();ns=0;nt=0;menu()}
else if(a=='mute'){S.mute=!S.mute;save();ic()}}

/* ---------- controles ---------- */
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
cv.addEventListener('pointerdown',e=>{if(state!='play')return;cv.setPointerCapture(e.pointerId);const q=pt(e),p=G.p;dr={id:e.pointerId,x0:q.x,y0:q.y,sx:p.x,sy:p.y,tx:p.x,ty:p.y}});
cv.addEventListener('pointermove',e=>{if(!dr||e.pointerId!=dr.id)return;const q=pt(e);dr.tx=cl(dr.sx+(q.x-dr.x0)*1.25,20,340);dr.ty=cl(dr.sy+(q.y-dr.y0)*1.25,60,590)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{if(dr&&e.pointerId==dr.id)dr=null}));
$('#hb').addEventListener('pointerdown',e=>{e.preventDefault();e.target.closest('[data-b]')?special():bomb()});
st.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,+b.dataset.i)});
addEventListener('pointerdown',aud);
addEventListener('keydown',e=>{aud();const k=e.key.length>1?e.key:e.key.toLowerCase();keys[k]=1;if(k=='b'||k==' ')bomb();if(k=='e'||k=='Shift')special();if(k=='p'||k=='Escape')act(state=='play'?'pause':'resume');if(k=='m')act('mute');if(k.startsWith('Arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)act('pause')});
const fit=()=>st.style.setProperty('--s',Math.min(innerWidth/W,innerHeight/H));addEventListener('resize',fit);fit();
const ic=()=>document.querySelectorAll('[data-a=mute]').forEach(b=>b.textContent=S.mute?'🔇':'🔊');ic();
menu();requestAnimationFrame(loop);
</script>
</body>
