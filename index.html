
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Strike - Arcade</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050713;color:white;
  font-family:Arial,sans-serif;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh
}
#game{
  position:relative;width:min(100vw,900px);
  height:min(100vh,650px);background:#080d24;
  overflow:hidden;border:2px solid #243c78;
  box-shadow:0 0 35px #174bba
}
canvas{width:100%;height:100%;display:block}
#hud{
  position:absolute;top:12px;left:12px;right:12px;
  display:flex;justify-content:space-between;
  gap:8px;font-weight:bold;font-size:14px;
  text-shadow:0 0 8px #00cfff;pointer-events:none
}
#overlay{
  position:absolute;inset:0;background:#030817df;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:25px
}
h1{font-size:clamp(30px,7vw,58px);color:#54eaff;
  text-shadow:0 0 20px #008cff;margin:0 0 12px}
p{line-height:1.6;color:#d3e4ff}
button{
  border:0;border-radius:10px;padding:14px 25px;
  background:#00bce8;color:#001321;font-weight:bold;
  font-size:17px;cursor:pointer;margin:8px
}
button:active{transform:scale(.96)}
#mobile{
  position:absolute;bottom:12px;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:0 18px;pointer-events:none
}
.pad{display:flex;gap:12px}
.pad button{pointer-events:auto;opacity:.7;
  width:62px;height:55px;padding:0;font-size:23px}
.small{font-size:12px;color:#9db8e9}
</style>
</head>
<body>
<div id="game">
  <canvas id="screen" width="900" height="650"></canvas>
  <div id="hud">
    <span id="score">Pontos: 0</span>
    <span id="level">Fase: 1</span>
    <span id="lives">Vidas: 3</span>
    <span id="record">Recorde: 0</span>
  </div>
  <div id="overlay">
    <h1>GALAXY STRIKE</h1>
    <p>Defenda a galáxia! Destrua os inimigos,<br>
    sobreviva às ondas e derrote os chefões.</p>
    <p>← → ou A/D para mover<br>ESPAÇO para atirar</p>
    <button id="start">INICIAR MISSÃO</button>
    <div class="small">Colete bônus e alcance o maior recorde!</div>
  </div>
  <div id="mobile">
    <div class="pad">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <button id="fire">🔥</button>
  </div>
</div>
<script>
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const W=900,H=650;
const $=id=>document.getElementById(id);
let keys={},running=false,score=0,level=1,lives=3;
let bullets=[],enemies=[],enemyShots=[],bonuses=[],stars=[];
let boss=null,spawnTimer=0,shotTimer=0,bonusTimer=0;
let triple=0,shield=0,player;
let record=Number(localStorage.getItem("galaxyRecord")||0);
$("record").textContent="Recorde: "+record;

for(let i=0;i<130;i++)stars.push({
 x:Math.random()*W,y:Math.random()*H,
 s:Math.random()*2+.5,v:Math.random()*1.8+.3
});

function reset(){
 score=0;level=1;lives=3;bullets=[];enemies=[];
 enemyShots=[];bonuses=[];boss=null;
 triple=0;shield=0;spawnTimer=0;shotTimer=0;
 player={x:W/2,y:H-75,w:42,h:42,inv:0};
 updateHud();
}
function updateHud(){
 $("score").textContent="Pontos: "+score;
 $("level").textContent="Fase: "+level;
 $("lives").textContent="Vidas: "+lives;
 $("record").textContent="Recorde: "+record;
}
function text(str,x,y,size,color){
 ctx.fillStyle=color;ctx.font="bold "+size+"px Arial";
 ctx.textAlign="center";ctx.fillText(str,x,y);
}
function drawPlayer(){
 ctx.save();ctx.translate(player.x,player.y);
 ctx.shadowBlur=20;ctx.shadowColor="#00eaff";
 ctx.fillStyle="#42eaff";
 ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(21,22);
 ctx.lineTo(0,13);ctx.lineTo(-21,22);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";ctx.fillRect(-4,-3,8,17);
 ctx.fillStyle="#ff9d32";ctx.fillRect(-7,20,14,12);
 if(shield>0){
  ctx.strokeStyle="#39ffb4";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
}
function shoot(){
 if(shotTimer>0)return;
 shotTimer=triple>0?9:15;
 const offsets=triple>0?[-14,0,14]:[0];
 offsets.forEach((o,i)=>{
  bullets.push({x:player.x+o,y:player.y-24,
    vx:triple>0?(i-1)*2:0,vy:-10});
 });
}
function enemySpawn(){
 const hp=1+Math.floor(level/3);
 enemies.push({
  x:45+Math.random()*(W-90),y:-35,
  hp,max:hp,r:17+Math.random()*7,
  vx:(Math.random()-.5)*2,
  vy:1.1+level*.13
 });
}
function spawnBoss(){
 boss={x:W/2,y:100,hp:20+level*7,
 max:20+level*7,dir:1,timer:0};
}
function addBonus(x,y){
 const types=["shield","triple","life"];
 const type=types[Math.floor(Math.random()*types.length)];
 bonuses.push({x,y,type,vy:2});
}
function hitPlayer(){
 if(shield>0||player.inv>0)return;
 lives--;player.inv=100;updateHud();
 if(lives<=0)endGame();
}
function endGame(){
 running=false;
 $("overlay").style.display="flex";
 $("overlay").innerHTML=
 '<h1>FIM DE JOGO</h1><p>Pontuação: '+score+
 '<br>Fase alcançada: '+level+'</p>'+
 '<button id="start">JOGAR NOVAMENTE</button>';
 $("start").onclick=startGame;
}
function startGame(){
 reset();running=true;$("overlay").style.display="none";
}
$("start").onclick=startGame;

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#070b20";ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{
  s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}
  ctx.fillStyle="#a9d9ff";
  ctx.globalAlpha=.4+s.s/4;
  ctx.fillRect(s.x,s.y,s.s,s.s);
 });
 ctx.globalAlpha=1;
 bullets.forEach(b=>{
  ctx.fillStyle="#53f7ff";ctx.shadowBlur=12;
  ctx.shadowColor="#00dfff";ctx.fillRect(b.x-3,b.y,6,17);
 });
 ctx.shadowBlur=0;
 enemies.forEach(e=>{
  ctx.fillStyle="#ff466c";ctx.shadowBlur=12;
  ctx.shadowColor="#ff174e";
  ctx.beginPath();ctx.moveTo(e.x,e.y+e.r);
  ctx.lineTo(e.x-e.r,e.y-e.r);
  ctx.lineTo(e.x,e.y-e.r/2);
  ctx.lineTo(e.x+e.r,e.y-e.r);ctx.closePath();ctx.fill();
  if(e.max>1){
   ctx.fillStyle="#fff";ctx.fillRect(e.x-15,e.y-e.r-9,30,4);
   ctx.fillStyle="#ff315f";ctx.fillRect(e.x-15,e.y-e.r-9,30*e.hp/e.max,4);
  }
 });
 enemyShots.forEach(b=>{
  ctx.fillStyle="#ffae42";ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
 });
 bonuses.forEach(b=>{
  ctx.fillStyle=b.type==="life"?"#ff5b89":
   b.type==="shield"?"#42ffb1":"#ffe45b";
  ctx.beginPath();ctx.arc(b.x,b.y,13,0,Math.PI*2);ctx.fill();
  text(b.type==="life"?"+1":b.type==="shield"?"S":"3X",b.x,b.y+5,12,"#071326");
 });
 if(boss){
  ctx.fillStyle="#a34cff";ctx.shadowBlur=25;ctx.shadowColor="#bd54ff";
  ctx.beginPath();ctx.moveTo(boss.x,boss.y+55);
  ctx.lineTo(boss.x-90,boss.y-30);
  ctx.lineTo(boss.x-45,boss.y-20);
  ctx.lineTo(boss.x,boss.y-55);
  ctx.lineTo(boss.x+45,boss.y-20);
  ctx.lineTo(boss.x+90,boss.y-30);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";ctx.fillRect(boss.x-100,boss.y-72,200,9);
  ctx.fillStyle="#ff3c8e";
  ctx.fillRect(boss.x-100,boss.y-72,200*boss.hp/boss.max,9);
 }
 if(player&&running){
  if(player.inv%10<7)drawPlayer();
 }
}

function update(){
 if(!running)return;
 stars.forEach(s=>{});
 if(keys.ArrowLeft||keys.a||keys.A)player.x-=6;
 if(keys.ArrowRight||keys.d||keys.D)player.x+=6;
 player.x=Math.max(25,Math.min(W-25,player.x));
 if(keys.Space||keys[" "])shoot();
 if(shotTimer>0)shotTimer--;
 if(player.inv>0)player.inv--;
 if(triple>0)triple--;
 if(shield>0)shield--;

 bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
 bullets=bullets.filter(b=>b.y>-20&&b.x>0&&b.x<W);
 spawnTimer--;
 if(!boss&&spawnTimer<=0){
  enemySpawn();spawnTimer=Math.max(18,65-level*3);
 }
 enemies.forEach(e=>{
  e.x+=e.vx;e.y+=e.vy;
  if(e.x<e.r||e.x>W-e.r)e.vx*=-1;
  if(Math.random()<.006+level*.0005)
   enemyShots.push({x:e.x,y:e.y+10,vy:3+level*.12});
  if(e.y>H-45) {e.y=-30;hitPlayer()}
  if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+18) {
   e.y=-50;hitPlayer();
  }
 });
 enemyShots.forEach(b=>b.y+=b.vy);
 enemyShots=enemyShots.filter(b=>b.y<H+20);
 enemyShots.forEach(b=>{
  if(Math.hypot(b.x-player.x,b.y-player.y)<22) {
   b.y=H+50;hitPlayer();
  }
 });
 bullets.forEach(b=>{
  enemies.forEach(e=>{
   if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+8){
    e.hp--;b.y=-50;
    if(e.hp<=0){
     score+=10+level*2;
     if(Math.random()<.13)addBonus(e.x,e.y);
    }
   }
  });
  if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<85){
   boss.hp--;b.y=-50;
   if(boss.hp<=0){
    score+=500;boss=null;level++;
    spawnTimer=100;
   }
  }
 });
 enemies=enemies.filter(e=>e.hp>0);
 if(boss){
  boss.x+=boss.dir*(2+level*.1);
  if(boss.x>W-110||boss.x<110)boss.dir*=-1;
  boss.timer++;
  if(boss.timer%38===0)enemyShots.push({
   x:boss.x,y:boss.y+45,vy:4+level*.1
  });
 }else if(level%5===0&&enemies.length===0&&score>0){
  spawnBoss();
 }
 bonuses.forEach(b=>{
  b.y+=b.vy;
  if(Math.hypot(b.x-player.x,b.y-player.y)<30){
   if(b.type==="life")lives=Math.min(5,lives+1);
   if(b.type==="shield")shield=600;
   if(b.type==="triple")triple=600;
   score+=50;b.y=H+100;updateHud();
  }
 });
 bonuses=bonuses.filter(b=>b.y<H+20);
 if(score>=level*180&&level%5!==0&&!boss){
  level++;spawnTimer=100;
 }
 updateHud();
 if(score>record){
  record=score;localStorage.setItem("galaxyRecord",record);
 }
}
function loop(){
 update();draw();requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowLeft","ArrowRight"," ","Space"].includes(e.key))e.preventDefault();
});
document.addEventListener("keyup",e=>keys[e.key]=false);
function bindButton(id,key){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  b.addEventListener(ev,()=>keys[key]=false));
}
bindButton("left","ArrowLeft");
bindButton("right","ArrowRight");
bindButton("fire","Space");
loop();
</script>
</body>
</html>
